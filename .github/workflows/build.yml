name: Build AIStudio Rust for Intel Mac (macOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Rust Binary for Intel Mac (x86_64-apple-darwin)
        run: |
          cargo build --release --target x86_64-apple-darwin

      - name: Package Standalone macOS .app Bundle
        run: |
          APP_NAME="AIStudio"
          APP_DIR="$APP_NAME.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS"
          mkdir -p "$RESOURCES"
          mkdir -p "$RESOURCES/zh-Hans.lproj"
          mkdir -p "$RESOURCES/zh_CN.lproj"

          # 拷贝 Rust 编译好的二进制文件
          cp "target/x86_64-apple-darwin/release/aistudio" "$MACOS/$APP_NAME"
          chmod +x "$MACOS/$APP_NAME"

          # 生成纯白底高清 AppIcon.icns
          cat << 'EOF' > make_icns.swift
          import AppKit

          let width = 1024
          let height = 1024
          guard let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: width,
              pixelsHigh: height,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: width * 4,
              bitsPerPixel: 32
          ) else { exit(1) }

          NSGraphicsContext.saveGraphicsState()
          guard let ctx = NSGraphicsContext(bitmapImageRep: rep) else { exit(1) }
          NSGraphicsContext.current = ctx
          let cg = ctx.cgContext

          let rect = CGRect(x: 96, y: 96, width: 832, height: 832)
          let squircle = CGPath(roundedRect: rect, cornerWidth: 208, cornerHeight: 208, transform: nil)

          cg.saveGState()
          cg.setShadow(offset: CGSize(width: 0, height: -24), blur: 50, color: NSColor.black.withAlphaComponent(0.18).cgColor)
          cg.addPath(squircle)
          cg.fillPath()
          cg.restoreGState()

          cg.saveGState()
          cg.addPath(squircle)
          cg.clip()
          cg.setFillColor(NSColor.white.cgColor)
          cg.fill(rect)

          cg.setLineWidth(3.0)
          cg.setStrokeColor(NSColor.black.withAlphaComponent(0.08).cgColor)
          cg.addPath(squircle)
          cg.strokePath()

          let pStyle = NSMutableParagraphStyle()
          pStyle.alignment = .center

          let gAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 132, weight: .heavy),
              .foregroundColor: NSColor(white: 0.08, alpha: 1.0),
              .paragraphStyle: pStyle
          ]
          "Google".draw(in: CGRect(x: 96, y: 640, width: 832, height: 152), withAttributes: gAttrs)

          let aAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 192, weight: .black),
              .foregroundColor: NSColor.black,
              .paragraphStyle: pStyle,
              .kern: 5.0
          ]
          "AI".draw(in: CGRect(x: 96, y: 412, width: 832, height: 212), withAttributes: aAttrs)

          let sAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 144, weight: .heavy),
              .foregroundColor: NSColor(white: 0.12, alpha: 1.0),
              .paragraphStyle: pStyle
          ]
          "Studio".draw(in: CGRect(x: 96, y: 232, width: 832, height: 164), withAttributes: sAttrs)

          cg.restoreGState()
          NSGraphicsContext.restoreGraphicsState()

          if let png = rep.representation(using: .png, properties: [:]) {
              try? png.write(to: URL(fileURLWithPath: "icon_1024.png"))
          }
          EOF

          swift make_icns.swift

          mkdir -p AppIcon.iconset
          sips -z 16 16     icon_1024.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     icon_1024.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon_1024.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     icon_1024.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon_1024.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   icon_1024.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon_1024.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   icon_1024.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon_1024.png --out AppIcon.iconset/icon_512x512.png
          cp icon_1024.png AppIcon.iconset/icon_512x512@2x.png

          iconutil -c icns AppIcon.iconset -o "$RESOURCES/AppIcon.icns"

          # 写入 Info.plist
          cat <<EOF > "$CONTENTS/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.oupeng.aistudio.rustapp</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>26.7.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleAllowMixedLocalizations</key>
              <true/>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>zh-Hans</string>
                  <string>zh_CN</string>
              </array>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$APP_DIR"
          zip -r -y "AIStudio-Rust-macOS-Intel.zip" "$APP_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-Rust-macOS-Intel
          path: AIStudio-Rust-macOS-Intel.zip
