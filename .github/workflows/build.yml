name: Build AIStudio for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build for Intel MacBook Pro 2020 (macOS 26)
        run: |
          swift build -c release \
            --arch x86_64 \
            -Xswiftc -target -Xswiftc x86_64-apple-macosx26.0

      - name: Package Standalone App Bundle with Guaranteed Liquid Glass AppIcon
        run: |
          APP_NAME="AIStudio"
          APP_DIR="$APP_NAME.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS"
          mkdir -p "$RESOURCES"
          mkdir -p "$RESOURCES/zh-Hans.lproj"
          mkdir -p "$RESOURCES/zh_CN.lproj"

          # 拷贝编译好的二进制
          BIN_PATH=$(find .build -name "$APP_NAME" -type f -perm +111 | grep "release" | head -n 1)
          cp "$BIN_PATH" "$MACOS/$APP_NAME"
          chmod +x "$MACOS/$APP_NAME"

          # 1. 采用无窗口依赖的 NSBitmapImageRep 离线渲染严格遵循 macOS 26 Liquid Glass 规范的 1024 高清图标
          cat << 'EOF' > make_icns.swift
          import AppKit

          let width = 1024
          let height = 1024
          guard let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: width,
              pixelsHigh: height,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: width * 4,
              bitsPerPixel: 32
          ) else { exit(1) }

          NSGraphicsContext.saveGraphicsState()
          guard let ctx = NSGraphicsContext(bitmapImageRep: rep) else { exit(1) }
          NSGraphicsContext.current = ctx
          let cg = ctx.cgContext

          let rect = CGRect(x: 96, y: 96, width: 832, height: 832)
          let squircle = CGPath(roundedRect: rect, cornerWidth: 208, cornerHeight: 208, transform: nil)

          // 拟态柔和投影
          cg.saveGState()
          cg.setShadow(offset: CGSize(width: 0, height: -28), blur: 56, color: NSColor.black.withAlphaComponent(0.40).cgColor)
          cg.addPath(squircle)
          cg.fillPath()
          cg.restoreGState()

          // 液体玻璃底座：黑曜烟熏深空渐变（绝非死黑）
          cg.saveGState()
          cg.addPath(squircle)
          cg.clip()

          let space = CGColorSpaceCreateDeviceRGB()
          let obsidianColors = [
              NSColor(red: 0.12, green: 0.14, blue: 0.19, alpha: 0.96).cgColor,
              NSColor(red: 0.08, green: 0.09, blue: 0.13, alpha: 0.98).cgColor,
              NSColor(red: 0.05, green: 0.06, blue: 0.08, alpha: 1.00).cgColor
          ]
          if let grad = CGGradient(colorsSpace: space, colors: obsidianColors as CFArray, locations: [0.0, 0.45, 1.0]) {
              cg.drawLinearGradient(grad, start: CGPoint(x: 512, y: 928), end: CGPoint(x: 512, y: 96), options: [])
          }

          // 内部焦散折射微光晕
          let center = CGPoint(x: 512, y: 512)
          let glowColors = [
              NSColor(red: 0.25, green: 0.40, blue: 0.70, alpha: 0.14).cgColor,
              NSColor(red: 0.10, green: 0.15, blue: 0.35, alpha: 0.00).cgColor
          ]
          if let radialGrad = CGGradient(colorsSpace: space, colors: glowColors as CFArray, locations: [0.0, 1.0]) {
              cg.drawRadialGradient(radialGrad, startCenter: center, startRadius: 20, endCenter: center, endRadius: 360, options: [])
          }

          // 菲涅尔天光边缘高光
          let rim = CGPath(roundedRect: rect.insetBy(dx: 4, dy: 4), cornerWidth: 204, cornerHeight: 204, transform: nil)
          cg.setLineWidth(4.5)
          cg.setStrokeColor(NSColor.white.withAlphaComponent(0.24).cgColor)
          cg.addPath(rim)
          cg.strokePath()

          // 三排纯白文字排版
          let pStyle = NSMutableParagraphStyle()
          pStyle.alignment = .center

          let gAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 132, weight: .heavy),
              .foregroundColor: NSColor(white: 0.94, alpha: 1.0),
              .paragraphStyle: pStyle
          ]
          "Google".draw(in: CGRect(x: 96, y: 640, width: 832, height: 152), withAttributes: gAttrs)

          let aAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 192, weight: .black),
              .foregroundColor: NSColor.white,
              .paragraphStyle: pStyle,
              .kern: 5.0
          ]
          "AI".draw(in: CGRect(x: 96, y: 412, width: 832, height: 212), withAttributes: aAttrs)

          let sAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 144, weight: .heavy),
              .foregroundColor: NSColor(white: 0.90, alpha: 1.0),
              .paragraphStyle: pStyle
          ]
          "Studio".draw(in: CGRect(x: 96, y: 232, width: 832, height: 164), withAttributes: sAttrs)

          cg.restoreGState()
          NSGraphicsContext.restoreGraphicsState()

          if let png = rep.representation(using: .png, properties: [:]) {
              try? png.write(to: URL(fileURLWithPath: "icon_1024.png"))
          }
          EOF

          swift make_icns.swift

          # 2. 生成全套 iconset 分辨率
          mkdir -p AppIcon.iconset
          sips -z 16 16     icon_1024.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     icon_1024.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon_1024.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     icon_1024.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon_1024.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   icon_1024.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon_1024.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   icon_1024.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon_1024.png --out AppIcon.iconset/icon_512x512.png
          cp icon_1024.png AppIcon.iconset/icon_512x512@2x.png

          iconutil -c icns AppIcon.iconset -o "$RESOURCES/AppIcon.icns"

          # 3. 严格写入 Info.plist（指定 AppIcon.icns，去除 CFBundleIconName 冲突）
          cat <<EOF > "$CONTENTS/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.oupeng.aistudio.macapp</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>26.7.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleAllowMixedLocalizations</key>
              <true/>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>zh-Hans</string>
                  <string>zh_CN</string>
              </array>
              <key>LSMinimumSystemVersion</key>
              <string>26.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$APP_DIR"
          zip -r -y "AIStudio-macOS26-Intel.zip" "$APP_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-macOS26-Intel
          path: AIStudio-macOS26-Intel.zip
