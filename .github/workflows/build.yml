name: Build AIStudio for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build for Intel MacBook Pro 2020 (macOS 26)
        run: |
          swift build -c release \
            --arch x86_64 \
            -Xswiftc -target -Xswiftc x86_64-apple-macosx26.0

      - name: Package Standalone App Bundle with Embedded AppIcon.icns
        run: |
          APP_NAME="AIStudio"
          APP_DIR="$APP_NAME.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS"
          mkdir -p "$RESOURCES"

          # 拷贝编译好的二进制
          BIN_PATH=$(find .build -name "$APP_NAME" -type f -perm +111 | grep "release" | head -n 1)
          cp "$BIN_PATH" "$MACOS/$APP_NAME"
          chmod +x "$MACOS/$APP_NAME"

          # 1. 动态生成 1024x1024 高清底图并导出为物理 AppIcon.icns
          cat << 'EOF' > make_icns.swift
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let img = NSImage(size: size)
          img.lockFocus()
          guard let ctx = NSGraphicsContext.current?.cgContext else { exit(1) }

          let rect = CGRect(x: 96, y: 96, width: 832, height: 832)
          let squircle = CGPath(roundedRect: rect, cornerWidth: 208, cornerHeight: 208, transform: nil)

          ctx.saveGState()
          ctx.setShadow(offset: CGSize(width: 0, height: -32), blur: 72, color: NSColor.black.withAlphaComponent(0.48).cgColor)
          ctx.addPath(squircle)
          ctx.fillPath()
          ctx.restoreGState()

          ctx.saveGState()
          ctx.addPath(squircle)
          ctx.clip()

          let space = CGColorSpaceCreateDeviceRGB()
          let colors = [
              NSColor(red: 0.12, green: 0.13, blue: 0.18, alpha: 0.90).cgColor,
              NSColor(red: 0.04, green: 0.04, blue: 0.07, alpha: 0.98).cgColor
          ]
          if let grad = CGGradient(colorsSpace: space, colors: colors as CFArray, locations: [0.0, 1.0]) {
              ctx.drawLinearGradient(grad, start: CGPoint(x: 512, y: 928), end: CGPoint(x: 512, y: 96), options: [])
          }

          let rim = CGPath(roundedRect: rect.insetBy(dx: 6, dy: 6), cornerWidth: 202, cornerHeight: 202, transform: nil)
          ctx.setLineWidth(5.0)
          ctx.setStrokeColor(NSColor.white.withAlphaComponent(0.35).cgColor)
          ctx.addPath(rim)
          ctx.strokePath()

          let pStyle = NSMutableParagraphStyle()
          pStyle.alignment = .center

          let gAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 132, weight: .heavy),
              .foregroundColor: NSColor(white: 0.92, alpha: 1.0),
              .paragraphStyle: pStyle
          ]
          "Google".draw(in: CGRect(x: 96, y: 640, width: 832, height: 152), withAttributes: gAttrs)

          let aAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 192, weight: .black),
              .foregroundColor: NSColor.white,
              .paragraphStyle: pStyle,
              .kern: 5.0
          ]
          "AI".draw(in: CGRect(x: 96, y: 412, width: 832, height: 212), withAttributes: aAttrs)

          let sAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 144, weight: .heavy),
              .foregroundColor: NSColor(white: 0.88, alpha: 1.0),
              .paragraphStyle: pStyle
          ]
          "Studio".draw(in: CGRect(x: 96, y: 232, width: 832, height: 164), withAttributes: sAttrs)

          ctx.restoreGState()
          img.unlockFocus()

          if let tiff = img.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff), let png = rep.representation(using: .png, properties: [:]) {
              try? png.write(to: URL(fileURLWithPath: "base_1024.png"))
          }
          EOF

          swift make_icns.swift

          # 生成符合 Apple 规范的 .iconset 尺寸集合
          mkdir -p AppIcon.iconset
          sips -z 16 16     base_1024.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     base_1024.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     base_1024.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     base_1024.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   base_1024.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   base_1024.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   base_1024.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   base_1024.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   base_1024.png --out AppIcon.iconset/icon_512x512.png
          cp base_1024.png AppIcon.iconset/icon_512x512@2x.png

          # 使用 macOS 官方工具转换生成正式的 AppIcon.icns
          iconutil -c icns AppIcon.iconset -o "$RESOURCES/AppIcon.icns"

          # 2. 注入 Info.plist 并明确指定图标文件
          cat <<EOF > "$CONTENTS/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.user.aistudio.intel2020</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>26.7.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>26.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 签名与压缩
          codesign --force --deep --sign - "$APP_DIR"
          zip -r -y "AIStudio-macOS26-Intel.zip" "$APP_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-macOS26-Intel
          path: AIStudio-macOS26-Intel.zip
