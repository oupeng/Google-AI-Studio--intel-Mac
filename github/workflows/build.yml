name: Build AIStudio for Intel Mac (macOS 26)

on:
  workflow_dispatch: # 支持在 GitHub Actions 网页手动点击触发

jobs:
  build-macos:
    # 采用 macOS 26 (Tahoe) 官方官方运行器
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build for Intel MacBook Pro 2020 (macOS 26)
        run: |
          # 针对你的 2020 Intel 架构与 macOS 26 SDK 进行深度优化编译
          swift build -c release \
            --arch x86_64 \
            -Xswiftc -target -Xswiftc x86_64-apple-macosx26.0

      - name: Package Standalone App Bundle
        run: |
          APP_NAME="AIStudio"
          APP_DIR="$APP_NAME.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS"
          mkdir -p "$RESOURCES"

          # 抓取编译生成的 x86_64 二进制文件
          BIN_PATH=$(find .build -name "$APP_NAME" -type f -perm +111 | grep "release" | head -n 1)
          cp "$BIN_PATH" "$MACOS/$APP_NAME"
          chmod +x "$MACOS/$APP_NAME"

          # 写入严格对齐 macOS 26.0 的 Info.plist
          cat <<EOF > "$CONTENTS/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.user.aistudio.intel2020</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>26.7.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>26.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 免证书本地深度 Ad-Hoc 签名
          codesign --force --deep --sign - "$APP_DIR"

          # 压缩为 Zip 产物
          zip -r -y "AIStudio-macOS26-Intel.zip" "$APP_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-macOS26-Intel
          path: AIStudio-macOS26-Intel.zip
